{{define "sidebar"}}
<aside class="w-64 border-r bg-background flex flex-col">
    <!-- Logo -->
    <div class="h-14 flex items-center px-6 border-b">
        <a href="/" class="flex items-center gap-2">
            <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M6 5c7.18 0 13 5.82 13 13M6 11a7 7 0 017 7m-6 0a1 1 0 11-2 0 1 1 0 012 0z"/>
            </svg>
            <span class="font-semibold text-lg">EchoFeed</span>
        </a>
    </div>

    <!-- Navigation -->
    <nav class="flex-1 p-3 space-y-1 overflow-y-auto">
        <a href="/" class="sidebar-item flex items-center gap-3 px-3 py-2 rounded-md text-sm {{if eq .Active "index"}}active{{end}}">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
            </svg>
            仪表盘
        </a>

        <div class="pt-4 pb-2">
            <span class="px-3 text-xs font-medium text-muted-foreground">任务管理</span>
        </div>
        <a href="/tasks" class="sidebar-item flex items-center gap-3 px-3 py-2 rounded-md text-sm {{if eq .Active "tasks"}}active{{end}}">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/>
            </svg>
            任务列表
        </a>

        <div class="pt-4 pb-2">
            <span class="px-3 text-xs font-medium text-muted-foreground">数据源</span>
        </div>
        <a href="/feeds" class="sidebar-item flex items-center gap-3 px-3 py-2 rounded-md text-sm {{if eq .Active "feeds"}}active{{end}}">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 5c7.18 0 13 5.82 13 13M6 11a7 7 0 017 7m-6 0a1 1 0 11-2 0 1 1 0 012 0z"/>
            </svg>
            RSS 订阅
        </a>

        <div class="pt-4 pb-2">
            <span class="px-3 text-xs font-medium text-muted-foreground">配置</span>
        </div>
        <a href="/channels" class="sidebar-item flex items-center gap-3 px-3 py-2 rounded-md text-sm {{if eq .Active "channels"}}active{{end}}">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
            </svg>
            通知渠道
        </a>
        <a href="/bots" class="sidebar-item flex items-center gap-3 px-3 py-2 rounded-md text-sm {{if eq .Active "bots"}}active{{end}}">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
            </svg>
            AI 机器人
        </a>

        <div class="pt-4 pb-2">
            <span class="px-3 text-xs font-medium text-muted-foreground">系统</span>
        </div>
        <a href="/logs" class="sidebar-item flex items-center gap-3 px-3 py-2 rounded-md text-sm {{if eq .Active "logs"}}active{{end}}">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
            </svg>
            执行日志
        </a>
        <a href="/settings" class="sidebar-item flex items-center gap-3 px-3 py-2 rounded-md text-sm {{if eq .Active "settings"}}active{{end}}">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
            </svg>
            系统设置
        </a>
    </nav>

    <!-- Footer -->
    <div class="p-3 border-t">
        <div class="px-3 py-2 text-xs text-muted-foreground">
            EchoFeed v1.0.0
        </div>
    </div>
</aside>
{{end}}
